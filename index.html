<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Love Code 🔐</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.container {
  background: #1e293b;
  padding: 30px;
  border-radius: 15px;
  width: 320px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

input, textarea {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
  font-size: 14px;
}

textarea {
  resize: none;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #3b82f6;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #2563eb;
}

.copy {
  margin-top: 10px;
  background: #22c55e;
}

.copy:hover {
  background: #16a34a;
}

.small {
  text-align: center;
  font-size: 12px;
  margin-top: 10px;
  opacity: 0.6;
}
</style>
</head>

<body>

<div class="container">
  <h2>Love Code 🔐</h2>

  <input type="text" id="clave" placeholder="Clave secreta">

  <textarea id="mensaje" rows="3" placeholder="Escribe tu mensaje..."></textarea>

  <div class="buttons">
    <button onclick="encriptar()">Encriptar</button>
    <button onclick="desencriptar()">Desencriptar</button>
  </div>

  <textarea id="resultado" rows="3" placeholder="Resultado..."></textarea>

  <button class="copy" onclick="copiar()">Copiar resultado</button>

  <div class="small">
    Mensajes solo para quien tiene la clave 🔐
  </div>
</div>

<script>
function encriptar() {
  let texto = document.getElementById("mensaje").value;
  let clave = document.getElementById("clave").value;
  let resultado = "";

  for (let i = 0; i < texto.length; i++) {
    let desplazamiento = clave.charCodeAt(i % clave.length);
    resultado += String.fromCharCode(texto.charCodeAt(i) + (desplazamiento % 5));
  }

  document.getElementById("resultado").value = resultado;
}

function desencriptar() {
  let texto = document.getElementById("mensaje").value;
  let clave = document.getElementById("clave").value;
  let resultado = "";

  for (let i = 0; i < texto.length; i++) {
    let desplazamiento = clave.charCodeAt(i % clave.length);
    resultado += String.fromCharCode(texto.charCodeAt(i) - (desplazamiento % 5));
  }

  document.getElementById("resultado").value = resultado;
}

function copiar() {
  let resultado = document.getElementById("resultado");
  resultado.select();
  document.execCommand("copy");
  alert("Copiado 😏");
}
</script>

</body>
</html>
